[package]
name = "archonui"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "A tiled desktop workspace for coding-agent CLIs"
repository = "https://github.com/Abdullahalmutairi97/archonui"

[dependencies]
gpui = "0.2.2"
libc = "0.2"
base64 = "0.22"
image = "0.25"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
smallvec = "1"
ropey = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = "2"
notify = "8"
ignore = "0.4"
serde_json = "1"
smol = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.9"
vt100 = "0.16"
pulldown-cmark = { version = "0.13", default-features = false }
toml = "0.8"
# Same lyon GPUI uses, for round stroke caps and joins on drawn icons.
lyon = "=1.0.19"

# Dependencies (GPUI, image decoding) are slow unoptimized; build them with
# optimizations even in debug builds. ArchonUI's own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2
